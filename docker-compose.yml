services:

  # ── Postgres databases ────────────────────────────────────────────
  db1:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raft1
      POSTGRES_USER: raft
      POSTGRES_PASSWORD: raft
    volumes:
      - db1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raft -d raft1"]
      interval: 5s
      timeout: 3s
      retries: 10

  db2:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raft2
      POSTGRES_USER: raft
      POSTGRES_PASSWORD: raft
    volumes:
      - db2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raft -d raft2"]
      interval: 5s
      timeout: 3s
      retries: 10

  db3:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raft3
      POSTGRES_USER: raft
      POSTGRES_PASSWORD: raft
    volumes:
      - db3_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raft -d raft3"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Raft nodes ────────────────────────────────────────────────────
  node1:
    build: .
    command: python main.py --node-id 1 --port 8000 --data-dir /data
    ports:
      - "8001:8000"   # HTTP client-facing
      - "9001:50051"  # gRPC inter-node
    environment:
      NODE_ID: "1"
      DATABASE_URL: "postgresql://raft:raft@db1:5432/raft1"
      GRPC_PORT: "50051"
      GRPC_PEERS: "node1:50051,node2:50051,node3:50051"
    volumes:
      - node1_data:/data
    depends_on:
      db1:
        condition: service_healthy

  node2:
    build: .
    command: python main.py --node-id 2 --port 8000 --data-dir /data
    ports:
      - "8002:8000"
      - "9002:50051"
    environment:
      NODE_ID: "2"
      DATABASE_URL: "postgresql://raft:raft@db2:5432/raft2"
      GRPC_PORT: "50051"
      GRPC_PEERS: "node1:50051,node2:50051,node3:50051"
    volumes:
      - node2_data:/data
    depends_on:
      db2:
        condition: service_healthy

  node3:
    build: .
    command: python main.py --node-id 3 --port 8000 --data-dir /data
    ports:
      - "8003:8000"
      - "9003:50051"
    environment:
      NODE_ID: "3"
      DATABASE_URL: "postgresql://raft:raft@db3:5432/raft3"
      GRPC_PORT: "50051"
      GRPC_PEERS: "node1:50051,node2:50051,node3:50051"
    volumes:
      - node3_data:/data
    depends_on:
      db3:
        condition: service_healthy

  # ── Monitoring ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node1
      - node2
      - node3

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  db1_data:
  db2_data:
  db3_data:
  node1_data:
  node2_data:
  node3_data:
  grafana_data:
